<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Vaahan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --primary:#0f766e;     /* teal */
  --primary-dark:#065f46;/* dark green */
  --bg:#f0fdfa;
  --card:#ffffff;
  --text:#042f2e;
  --muted:#64748b;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#fff;
}
header .wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
}
header h2{margin:0 0 6px}
header select{
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:15px;
}

/* LAYOUT */
.wrap{max-width:1000px;margin:auto;padding:16px}
.card{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  margin-top:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
}
.hidden{display:none}

/* FORM */
label{
  display:block;
  font-weight:600;
  margin-top:12px;
}
input,select{
  width:100%;
  padding:11px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #99f6e4;
  font-size:15px;
}
input:focus,select:focus{
  outline:none;
  border-color:var(--primary);
}

/* BUTTON */
button{
  margin-top:16px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}
button:hover{
  background:var(--primary-dark);
}

/* LIST */
.list{margin-top:16px}
.item{
  background:#ecfeff;
  border:1px dashed #67e8f9;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}
.muted{
  color:var(--muted);
  font-size:13px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h2>The Vaahan 🚚</h2>
    <label>Select Role (अपना रोल चुनें)</label>
    <select id="roleSelect">
      <option value="shipper">Shipper (लोड देना)</option>
      <option value="transporter">Transporter (गाड़ी देना)</option>
    </select>
    <div class="muted">Clear requirement. Direct connection.</div>
  </div>
</header>

<main class="wrap">

<!-- SHIPPER -->
<div id="shipperPage" class="card hidden">
<h3>📦 Post Load</h3>

<label>Origin *</label>
<input id="loadOrigin">

<label>Destination *</label>
<input id="loadDest">

<label>Weight (tons) *</label>
<input id="loadWeight" type="number">

<label>Budget (₹)</label>
<input id="loadBudget" type="number">

<h4 style="margin-top:18px">Optional Details</h4>

<label>Pickup Date</label>
<input id="pickupDate" type="date">

<label>Preferred Vehicle</label>
<select id="prefVehicle">
  <option value="">Any</option>
  <option>Tata Ace</option>
  <option>Pickup / Bolero</option>
  <option>LCV / 407</option>
  <option>14T Truck</option>
  <option>20T Truck</option>
  <option>Trailer</option>
</select>

<label>Vehicle Size</label>
<select id="prefSize">
  <option value="">Any</option>
  <option>9 FT</option>
  <option>14 FT</option>
  <option>17 FT</option>
  <option>20 FT</option>
  <option>32 FT</option>
</select>

<button id="btnPostLoad">Post Load & Get Calls</button>

<div class="muted">
Aapki requirement relevant transporters tak share hoti hai.<br>
No commission. Direct contact.
</div>

<div id="loadList" class="list"></div>
</div>

<!-- TRANSPORTER -->
<div id="transporterPage" class="card hidden">
<h3>🚛 Post Vehicle</h3>

<label>Vehicle Type *</label>
<input id="vehType">

<label>Capacity (tons) *</label>
<input id="vehCap" type="number">

<label>Current Location *</label>
<input id="vehLoc">

<h4 style="margin-top:18px">Optional Details</h4>

<label>Vehicle Size</label>
<select id="vehSize">
  <option value="">Any</option>
  <option>9 FT</option>
  <option>14 FT</option>
  <option>17 FT</option>
  <option>20 FT</option>
  <option>32 FT</option>
</select>

<label>Availability</label>
<select id="vehAvail">
  <option value="">Select</option>
  <option>Available Now</option>
  <option>Today</option>
  <option>Tomorrow</option>
</select>

<button id="btnPostVehicle">Post Vehicle & Get Enquiries</button>

<div class="muted">
Sirf relevant shippers hi contact karenge.
</div>

<div id="vehicleList" class="list"></div>
</div>

</main>

<script>
const roleSelect=document.getElementById("roleSelect");
const shipperPage=document.getElementById("shipperPage");
const transporterPage=document.getElementById("transporterPage");

const WA="918276929832";

roleSelect.onchange=()=>show(roleSelect.value);
function show(r){
  shipperPage.classList.add("hidden");
  transporterPage.classList.add("hidden");
  if(r==="shipper")shipperPage.classList.remove("hidden");
  if(r==="transporter")transporterPage.classList.remove("hidden");
}

function wa(m){
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`);
}

btnPostLoad.onclick=()=>{
  if(!loadOrigin.value||!loadDest.value||!loadWeight.value)
    return alert("Required details missing");

  wa(`Load Requirement
${loadOrigin.value} → ${loadDest.value}
Weight: ${loadWeight.value}T
Vehicle: ${prefVehicle.value||"Any"}
Size: ${prefSize.value||"Any"}`);
};

btnPostVehicle.onclick=()=>{
  if(!vehType.value||!vehCap.value||!vehLoc.value)
    return alert("Required details missing");

  wa(`Vehicle Available
${vehType.value} | ${vehCap.value}T
Location: ${vehLoc.value}`);
};

show("shipper");
</script>

</body>
</html>
