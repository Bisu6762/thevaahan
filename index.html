<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Vaahan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --sky:#e0f2fe;
  --orange:#f97316;
  --dark:#0f172a;
  --card:#ffffff;
  --muted:#475569;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--sky);
  color:var(--dark);
}

/* HEADER */
header{
  background:linear-gradient(135deg,#bae6fd,#7dd3fc);
  border-bottom:3px solid var(--orange);
}
header .wrap{
  max-width:1100px;
  margin:auto;
  padding:18px;
}
header h2{margin:0;color:#0c4a6e}
header select{
  padding:10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  margin-right:8px;
}

/* LAYOUT */
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{
  background:var(--card);
  border-radius:16px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.1);
}
.hidden{display:none}

/* FORM */
label{display:block;font-weight:600;margin-top:12px}
input,select,textarea{
  width:100%;
  padding:11px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:15px;
}
textarea{resize:vertical}

/* BUTTON */
button{
  margin-top:18px;
  padding:13px 22px;
  border:none;
  border-radius:12px;
  background:var(--orange);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}
button:hover{background:#ea580c}

/* LIST */
.item{
  background:#f8fafc;
  border:1px dashed #94a3b8;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}
.muted{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h2 data-key="brand">The Vaahan 🚚</h2>

    <label data-key="roleLabel">Select Role</label>
    <select id="roleSelect">
      <option value="shipper" data-key="shipper">Shipper</option>
      <option value="transporter" data-key="transporter">Transporter</option>
    </select>

    <select onchange="changeLang(this.value)">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="bn">বাংলা</option>
    </select>

    <div class="muted" data-key="tagline">Clear requirement. Direct connection.</div>
  </div>
</header>

<main class="wrap">

<!-- SHIPPER -->
<div id="shipperPage" class="card hidden">
<h3 data-key="postLoad">📦 Post Load</h3>

<label data-key="origin">Origin</label>
<input id="loadOrigin">

<label data-key="dest">Destination</label>
<input id="loadDest">

<label data-key="weight">Weight (tons)</label>
<input id="loadWeight" type="number">

<label data-key="loadType">Load Type</label>
<select id="loadType">
<option>Steel</option><option>FMCG</option><option>Electronics</option>
<option>Machinery</option><option>Furniture</option><option>Others</option>
</select>

<label data-key="payment">Payment Type</label>
<select id="payment">
<option>Cash</option><option>Online</option><option>To-Pay</option>
</select>

<label data-key="contact">Contact Number</label>
<input id="shipContact">

<label data-key="notes">Notes</label>
<textarea id="shipNotes"></textarea>

<button id="btnPostLoad" data-key="postBtn">Post Load</button>
</div>

<!-- TRANSPORTER -->
<div id="transporterPage" class="card hidden">
<h3 data-key="postVehicle">🚛 Post Vehicle</h3>

<label data-key="vehType">Vehicle Type</label>
<input id="vehType">

<label data-key="capacity">Capacity (tons)</label>
<input id="vehCap" type="number">

<label data-key="location">Current Location</label>
<input id="vehLoc">

<label data-key="driver">Driver Name</label>
<input id="driverName">

<label data-key="vehNo">Vehicle Number</label>
<input id="vehNo">

<label data-key="fuel">Fuel Type</label>
<select id="fuel">
<option>Diesel</option><option>CNG</option><option>Electric</option>
</select>

<label data-key="contact">Contact Number</label>
<input id="vehContact">

<button id="btnPostVehicle" data-key="postVehBtn">Post Vehicle</button>
</div>
<!-- ================= DASHBOARD ================= -->
<div class="wrap">
  <div class="card">
    <h3>📊 Live Dashboard</h3>
    <p class="muted">
      Available Loads & Vehicles (Real-time view)
    </p>

    <h4>📦 Available Loads</h4>
    <div id="dashboardLoads" class="list">
      <div class="muted">No loads posted yet</div>
    </div>

    <h4 style="margin-top:20px">🚛 Available Vehicles</h4>
    <div id="dashboardVehicles" class="list">
      <div class="muted">No vehicles posted yet</div>
    </div>
  </div>
</div>


</main>

<script>
const WA="918276929832";

/* LANGUAGE */
const t={
en:{brand:"The Vaahan 🚚",roleLabel:"Select Role",shipper:"Shipper",transporter:"Transporter",
tagline:"Clear requirement. Direct connection.",postLoad:"📦 Post Load",
origin:"Origin",dest:"Destination",weight:"Weight (tons)",loadType:"Load Type",
payment:"Payment Type",contact:"Contact Number",notes:"Notes",
postBtn:"Post Load",postVehicle:"🚛 Post Vehicle",vehType:"Vehicle Type",
capacity:"Capacity (tons)",location:"Current Location",driver:"Driver Name",
vehNo:"Vehicle Number",fuel:"Fuel Type",postVehBtn:"Post Vehicle"},
hi:{brand:"द वाहन 🚚",roleLabel:"अपना रोल चुनें",shipper:"लोड देने वाला",
transporter:"गाड़ी देने वाला",tagline:"सीधी जरूरत। सीधा संपर्क।",
postLoad:"📦 लोड डालें",origin:"कहां से",dest:"कहां तक",weight:"वजन (टन)",
loadType:"सामान का प्रकार",payment:"भुगतान तरीका",contact:"संपर्क नंबर",
notes:"नोट्स",postBtn:"लोड पोस्ट करें",postVehicle:"🚛 गाड़ी डालें",
vehType:"गाड़ी का प्रकार",capacity:"क्षमता (टन)",location:"अभी कहां है",
driver:"ड्राइवर का नाम",vehNo:"गाड़ी नंबर",fuel:"ईंधन प्रकार",
postVehBtn:"गाड़ी पोस्ट करें"},
bn:{brand:"দ্য বাহান 🚚",roleLabel:"রোল নির্বাচন করুন",shipper:"লোডদাতা",
transporter:"গাড়িদাতা",tagline:"সরাসরি প্রয়োজন। সরাসরি যোগাযোগ।",
postLoad:"📦 লোড দিন",origin:"কোথা থেকে",dest:"কোথায়",weight:"ওজন (টন)",
loadType:"পণ্যের ধরন",payment:"পেমেন্ট ধরন",contact:"যোগাযোগ নম্বর",
notes:"নোট",postBtn:"লোড পোস্ট করুন",postVehicle:"🚛 গাড়ি দিন",
vehType:"গাড়ির ধরন",capacity:"ক্ষমতা (টন)",location:"বর্তমান অবস্থান",
driver:"চালকের নাম",vehNo:"গাড়ি নম্বর",fuel:"জ্বালানি ধরন",
postVehBtn:"গাড়ি পোস্ট করুন"}
};

function changeLang(l){
document.querySelectorAll("[data-key]").forEach(e=>{
e.innerText=t[l][e.dataset.key];
});
}

/* ROLE SWITCH */
const roleSelect=document.getElementById("roleSelect");
const shipperPage=document.getElementById("shipperPage");
const transporterPage=document.getElementById("transporterPage");
roleSelect.onchange=()=>show(roleSelect.value);
function show(r){
shipperPage.classList.add("hidden");
transporterPage.classList.add("hidden");
if(r==="shipper")shipperPage.classList.remove("hidden");
if(r==="transporter")transporterPage.classList.remove("hidden");
}
function updateDashboard(){
  // LOADS
  const dLoads = document.getElementById("dashboardLoads");
  if(loads.length===0){
    dLoads.innerHTML = `<div class="muted">No loads posted yet</div>`;
  } else {
    dLoads.innerHTML = loads.map(l =>
      `<div class="item">
        <strong>${l.o} → ${l.d}</strong><br>
        Weight: ${l.w}T | Vehicle: ${l.v||"Any"} | Size: ${l.s||"Any"}
      </div>`
    ).join("");
  }

  // VEHICLES
  const dVeh = document.getElementById("dashboardVehicles");
  if(vehicles.length===0){
    dVeh.innerHTML = `<div class="muted">No vehicles posted yet</div>`;
  } else {
    dVeh.innerHTML = vehicles.map(v =>
      `<div class="item">
        <strong>${v.t}</strong><br>
        Capacity: ${v.c}T | Location: ${v.l} | Size: ${v.size||"Any"}
      </div>`
    ).join("");
  }
}

show("shipper");

/* WHATSAPP */
function wa(m){window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`);}

btnPostLoad.onclick=()=>{
wa(`LOAD REQUIREMENT
From: ${loadOrigin.value}
To: ${loadDest.value}
Weight: ${loadWeight.value} T
Type: ${loadType.value}
Payment: ${payment.value}
Contact: ${shipContact.value}
Notes: ${shipNotes.value||"-"}`);
};

btnPostVehicle.onclick=()=>{
wa(`VEHICLE AVAILABLE
Type: ${vehType.value}
Capacity: ${vehCap.value} T
Location: ${vehLoc.value}
Driver: ${driverName.value}
Vehicle No: ${vehNo.value}
Fuel: ${fuel.value}
Contact: ${vehContact.value}`);
};
</script>

</body>
</html>
